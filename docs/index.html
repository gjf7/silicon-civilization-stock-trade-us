<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Silicon Civilization Stocks · Static Snapshot</title>
  <meta name="description" content="Static snapshot of the Silicon Civilization Stocks US trading system: tracking compute chips, optical modules, AI servers, liquid cooling, power, data centers, and semiconductor equipment & materials." />
  <link rel="canonical" href="https://haochen.me/silicon-civilization-stock-trade-us/" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:site_name" content="Silicon Civilization Stocks" />
  <meta property="og:title" content="Silicon Civilization Stocks · Static Snapshot" />
  <meta property="og:description" content="DeepSeek + Yahoo Finance powered US watchlist, price targets, signals, and backtest snapshot." />
  <meta property="og:url" content="https://haochen.me/silicon-civilization-stock-trade-us/" />
  <meta property="og:image" content="https://haochen.me/silicon-civilization-stock-trade-us/social-card.png" />
  <meta property="og:image:alt" content="Silicon Civilization Stocks social card" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Silicon Civilization Stocks · Static Snapshot" />
  <meta name="twitter:description" content="US silicon-civilization-consumption watchlist, analyst price targets, DeepSeek signals, and strategy backtest." />
  <meta name="twitter:image" content="https://haochen.me/silicon-civilization-stock-trade-us/social-card.png" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./i18n.js"></script>
</head>
<body>
  <div class="container">
    <div class="lang-bar">
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-locale="zh">中文</button>
        <button type="button" data-locale="en">EN</button>
      </div>
    </div>
    <header class="page-header">
      <div>
        <div class="eyebrow" data-i18n="eyebrow"></div>
        <h1 data-i18n="h1"></h1>
        <p data-i18n-html="intro"></p>
        <p class="muted" id="meta-line"></p>
      </div>
      <nav class="header-actions">
        <a class="button secondary" href="#universe" data-i18n="navWatchlist"></a>
        <a class="button secondary" href="#signals" data-i18n="navSignals"></a>
        <a class="button secondary" href="#backtest" data-i18n="navBacktest"></a>
      </nav>
    </header>

    <div class="summary-grid" id="kpi-grid"></div>

    <h2 class="subheading" id="universe" data-i18n="watchlistHeading"></h2>
    <p class="muted" data-i18n="watchlistSub"></p>
    <div class="toolbar">
      <div class="field">
        <span data-i18n="search"></span>
        <input id="search" />
      </div>
      <div class="field">
        <span data-i18n="themeLabel"></span>
        <select id="theme"><option value="all" data-i18n="allThemes"></option></select>
      </div>
      <label class="check"><input id="onlyGlobal" type="checkbox" /> <span data-i18n="filterGlobal"></span></label>
      <label class="check"><input id="onlyUpside" type="checkbox" /> <span data-i18n="filterUpside"></span></label>
      <div class="toolbar-status" id="status"></div>
    </div>
    <div class="theme-grid" id="universe-grid"></div>

    <h2 class="subheading" id="signals" data-i18n="signalsHeading"></h2>
    <p class="muted" data-i18n="signalsSub"></p>
    <div class="theme-panel">
      <div class="theme-title"><strong data-i18n="signalsPanelTitle"></strong><span id="signals-summary"></span></div>
      <div class="table-wrap"><table id="signals-table">
        <thead><tr>
          <th data-i18n="thTicker"></th><th data-i18n="thName"></th><th data-i18n="thTheme"></th><th data-i18n="thAction"></th>
          <th class="num" data-i18n="thConfidence"></th><th class="num" data-i18n="thSize"></th><th class="num" data-i18n="thPe"></th><th data-i18n="thRationale"></th>
        </tr></thead><tbody></tbody>
      </table></div>
    </div>

    <h2 class="subheading" id="backtest" data-i18n="backtestHeading"></h2>
    <p class="muted" id="backtest-window"></p>
    <div class="summary-grid" id="backtest-kpi"></div>
    <div class="card chart-card"><canvas id="equity-chart"></canvas></div>
    <div class="theme-panel" style="margin-top:14px">
      <div class="theme-title"><strong data-i18n="recentTrades"></strong><span id="trades-count"></span></div>
      <div class="table-wrap compact-table"><table id="trades-table">
        <thead><tr><th data-i18n="thDate"></th><th data-i18n="thSide"></th><th data-i18n="thTicker"></th><th class="num" data-i18n="thShares"></th><th class="num" data-i18n="thPrice"></th></tr></thead>
        <tbody></tbody>
      </table></div>
    </div>

    <footer class="muted" style="margin-top:32px;font-size:12px;line-height:1.6">
      <span data-i18n="footerSource"></span> <a href="https://github.com/gjf7/silicon-civilization-stock-trade-us">github.com/gjf7/silicon-civilization-stock-trade-us</a>.
      <span data-i18n="footerDisclaimer"></span>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
